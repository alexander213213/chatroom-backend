<body>
    <!-- Top Bar -->
    <header class="top-bar">
        <div class="profile-header">
            <div class="avatar">👨‍💻</div>
            <div class="profile-name">
                <div class="username">Loading...</div>
                <div class="view-profile">View Profile ▼</div>
            </div>
        </div>
        <div class="top-icons">
            <button class="icon-btn" title="Notifications">🔔</button>
            <button class="icon-btn" title="Home">🏠</button>
        </div>
    </header>

    <!-- Main Content -->
    <div class="main-container">
        <!-- Room Management Title (outside panels) -->
        <h1 class="section-title">Room Management</h1>
        
        <div class="content-wrapper">
            <!-- Left Side -->
            <div class="left-side">
                <!-- Create Room Panel -->
                <div class="panel create-room-panel">
                    <h2 class="panel-header">Create a Room</h2>
                    
                    <label class="input-label">Enter Room Name</label>
                    <input type="text" id="roomNameInput" class="text-input" placeholder="">
                    
                    <div class="advanced-settings">
                        <div class="settings-header" id="advancedToggle">Advanced Settings ∧</div>
                        <div class="settings-content" id="settingsContent">
                            <label class="checkbox-row">
                                <input type="checkbox" id="maxMembersCheck">
                                <span>Set Maximum Members</span>
                                <input type="number" id="maxMembersInput" class="inline-number" placeholder="# +" disabled>
                            </label>
                            <label class="checkbox-row">
                                <input type="checkbox" id="adminOnlyCheck">
                                <span>Admin Only</span>
                            </label>
                        </div>
                    </div>

                    <button class="btn-create" id="createRoomBtn">Create Room</button>
                </div>

                <!-- Team-ups Section -->
                <div class="panel teamups-panel">
                    <h2 class="panel-title">Team-ups</h2>
                    <label class="input-label">Search</label>
                    <input type="text" id="roomIdInput" class="text-input" placeholder="Enter Room ID">
                    <div id="roomSearchResult" class="search-result"></div>
                </div>
            </div>

            <!-- Right Side -->
            <div class="right-side">
                <!-- Your Rooms Section -->
                <div class="panel your-rooms-panel">
                    <h2 class="panel-title">Your Rooms</h2>
                    <div class="search-wrapper">
                        <input type="text" id="roomsSearch" class="search-input" placeholder="Enter room name">
                    </div>
                    <div id="roomsList" class="rooms-list">
                        <!-- Rooms will be populated here -->
                    </div>
                </div>

                <!-- Team Members Section -->
                <div class="panel team-members-panel">
                    <h2 class="panel-title">Team Members</h2>
                    <div id="teamMembersList" class="members-list">
                        <!-- Team members will be populated here -->
                    </div>
                </div>

                <!-- Invite Section -->
                <div class="panel invite-panel">
                    <div class="invite-row">
                        <div class="invite-col">
                            <label class="input-label">Select a Room</label>
                            <select id="selectRoomDropdown" class="dropdown">
                                <option value=""></option>
                            </select>
                        </div>
                        <div class="invite-col">
                            <label class="input-label">Invite Users</label>
                            <input type="text" id="inviteUsernameInput" class="text-input" placeholder="Enter username">
                        </div>
                    </div>
                    <button class="btn-invite" id="sendInviteBtn">Send Invite</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Confirmation Modal -->
    <div id="confirmModal" class="modal" style="display: none;">
        <div class="modal-content">
            <p id="modalMessage">Room created successfully!</p>
            <button class="btn-ok" id="modalOkBtn">OK</button>
        </div>
    </div>
</body>
