<div class="auth" id="login">
    <div class="login_container">
        <div class="upper_box">
            <img src="/" alt="Meerkat - MeeTeams Logo">
        </div>
        <h1 class="header">Login</h1>
        <p>Welcome back! Get started by logging into your account</p>
        
        <form>
            <input class="form_holder" type="text" name="username" placeholder="Username" required>
            <input class="form_holder" type="password" name="password" placeholder="Password" required>

            <button type="submit" class="login_btn">Log In</button>
        </form>

        <label for="keep_me_login_input" class="custom-checkbox-container">
            <input type="checkbox" id="keep_me_login_input">
    
            <span class="checkmark"></span>
    
            Keep me logged in
        </label>
        
        <div>
            <p class="bottom_text">Don't have an account yet? Sign up now!</p>
            <button type="button" class="signup_btn">Sign Up</button>
        </div>
    </div>

    <div class="right_side"></div>
</div>

<div class="auth" id="signup">
    
    <div class="left_side"></div>

    <div class="signup_container">
        <h1 class="header" id="upper">Create An</h1>
        <h1 class="header" id="lower">Account</h1>
        
        <form>
            <input class="form_holder" type="text" name="username" placeholder="Username" required>
            <input class="form_holder" type="password" name="password" placeholder="Password" required>

            <button type="submit" class="register_btn">Sign Up</button>
        </form>

        <div>
            <p class="bottom_text">Already have an account? Login here</p>
            <button type="button" class="log_btn">Login</button>
        </div>
        
        <div class="lower_box">
            <img src="/" alt="Meerkat - MeeTeams Logo">
        </div>
    </div>
</div>

<div id="toastContainer"></div>
