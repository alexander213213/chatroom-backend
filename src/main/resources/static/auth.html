<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeeTeams - Login</title>
    <link rel="stylesheet" href="global.css">
    <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body>
    <div class="auth" id="login">
        <div class="login_container">
            <div class="upper_box">
                <img src="/" alt="Meerkat - MeeTeams Logo">
            </div>
            <h1 class="header">Login</h1>
            <p>Welcome back! Get started by logging into your account</p>
            
            <form>
                <input class="form_holder" type="text" name="username" placeholder="Username" required>
                <input class="form_holder" type="password" name="password" placeholder="Password" required>
                <button type="submit" class="login_btn">Log In</button>
            </form>

            <label for="keep_me_login_input" class="custom-checkbox-container">
                <input type="checkbox" id="keep_me_login_input">
                <span class="checkmark"></span>
                Keep me logged in
            </label>
            
            <div>
                <p class="bottom_text">Don't have an account yet? Sign up now!</p>
                <button type="button" class="signup_btn">Sign Up</button>
            </div>
        </div>

        <div class="right_side">
            <video autoplay loop muted playsinline class="background-video">
                <source src="resources/images/Phuc ass character select.mp4" type="video/mp4">
            </video>
        </div>
    </div>

    <div class="auth" id="signup">
        <div class="right_side">
            <video autoplay loop muted playsinline class="background-video">
                <source src="resources/images/Phuc ass character select.mp4" type="video/mp4">
            </video>
        </div>

        <div class="signup_container">
            <h1 class="header" id="upper">Create An</h1>
            <h1 class="header" id="lower">Account</h1>
            
            <form>
                <input class="form_holder" type="text" name="username" placeholder="Username" required>
                <input class="form_holder" type="password" name="password" placeholder="Password" required>
                <button type="submit" class="register_btn">Sign Up</button>
            </form>

            <div>
                <p class="bottom_text">Already have an account? Login here</p>
                <button type="button" class="log_btn">Login</button>
            </div>
            
            <div class="lower_box">
                <img src="/" alt="Meerkat - MeeTeams Logo">
            </div>
        </div>
    </div>

    <div id="toastContainer"></div>

    <!-- Character Select Section -->
    <div class="auth" id="characterSelect" style="display: none;">
        <video autoplay loop muted playsinline class="character-select-video">
            <source src="resources/images/1228.mp4" type="video/mp4">
        </video>
        
        <div class="character_select_container">
            <h1 class="header character-header">Choose Your Character</h1>
            
            <div class="character_carousel_wrapper">
                <button class="carousel-nav prev" id="prevChar">‹</button>
                
                <div class="character_carousel">
                    <div class="carousel-track">
                        <div class="character-slide" data-character-id="default">
                            <img src="resources/images/Character Gifs/Base.gif" alt="Default Meerkat">
                            <p class="character-name">Default</p>
                        </div>
                        
                        <div class="character-slide" data-character-id="butler">
                            <img src="resources/images/Character Gifs/Butler.gif" alt="Butler Meerkat">
                            <p class="character-name">Butler</p>
                        </div>
                        
                        <div class="character-slide" data-character-id="dinosaur">
                            <img src="resources/images/Character Gifs/Dinosaur.gif" alt="Dino Meerkat">
                            <p class="character-name">Dinosaur</p>
                        </div>
                        
                        <div class="character-slide" data-character-id="doctor">
                            <img src="resources/images/Character Gifs/Doctor.gif" alt="Doctor Meerkat">
                            <p class="character-name">Doctor</p>
                        </div>
                        
                        <div class="character-slide" data-character-id="florist">
                            <img src="resources/images/Character Gifs/Flower.gif" alt="Florist Meerkat">
                            <p class="character-name">Florist</p>
                        </div>

                        <div class="character-slide" data-character-id="hotdog">
                            <img src="resources/images/Character Gifs/Hotdog.gif" alt="Hotdog(?) Meerkat">
                            <p class="character-name">Hotdog(?)</p>
                        </div>
                        
                        <div class="character-slide" data-character-id="librarian">
                            <img src="resources/images/Character Gifs/Librarian.gif" alt="Librarian Meerkat">
                            <p class="character-name">Librarian</p>
                        </div>
                        
                        <div class="character-slide" data-character-id="strawberry">
                            <img src="resources/images/Character Gifs/Strawberry.gif" alt="Strawberry Meerkat">
                            <p class="character-name">Strawberry</p>
                        </div>
                    </div>
                </div>
                
                <button class="carousel-nav next" id="nextChar">›</button>
            </div>
            
            <button class="select_character_btn" id="selectCharacterBtn">Select Character</button>
        </div>
    </div>

    <script src="assets/js/auth.js"></script>
</body>
</html>
