<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        html {
            font-size: 100%; 
        }
        body {
            font-family: 'Pixellari', sans-serif;
            color: #2a1810;
            overflow-x: hidden;
            margin: 0;
            padding: 0;
            font-size: 1rem;
        }
        :root {
            --bg-panel: #d4a084;
            --bg-window: #f5d6bc;
            --border-dark: #8b5a3c;
            --border-light: #f9e8d8;
            --text-main: #2a1810;
            --text-muted: #9c6b4e;
            --mint: #b8e6d5;
            --cream: #f5d6bc;
        }
        .top-bar {
            height: 6.25rem; 
            background: var(--bg-panel);
            border-bottom: 0.1875rem solid var(--border-dark);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 1.875rem; 
            box-shadow: inset 0 -0.125rem 0 var(--border-dark);
            box-sizing: border-box;
        }
        .profile-header {
            display: flex;
            align-items: center;
            gap: 1.25rem; 
        }
        .avatar {
            width: 3.75rem;
            height: 3.75rem;
            background: white;
            border: 0.1875rem solid var(--border-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem; 
            border-radius: 0.25rem;
        }
        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 0.1rem;
        }
        .profile-name {
            display: flex;
            flex-direction: column;
            gap: 0.3125rem;
        }
        .username {
            font-size: 1.25rem;
            font-weight: bold;
            color: var(--text-main);
        }
        .view-profile {
            font-size: 0.75rem;
            color: var(--text-muted);
            cursor: pointer;
        }
        .view-profile a {
            color: var(--text-muted);
            text-decoration: underline;
        }
        .view-profile a:hover {
            color: var(--text-main);
        }
        .top-icons {
            display: flex;
            gap: 0.9375rem; 
        }
        .icon-btn {
            width: 3.125rem;
            height: 3.125rem;
            background: var(--bg-window);
            border: 0.1875rem solid var(--border-dark);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem; 
            transition: transform 0.1s;
            text-decoration: none;
            border-radius: 0.25rem;
        }
        .icon-btn img {
            width: 60%; 
            height: auto;
            display: block;
        }
        .icon-btn:hover {
            transform: scale(1.05);
            background: #ffe4cd;
        }
        .icon-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>

<header class="top-bar">
    <div class="profile-header">
        <div class="avatar"><img src="/" alt="profile"></div>
        <div class="profile-name">
            <div class="username">Loading...</div>
            <div class="view-profile">
                <a href="#" onclick="navigateTo('dashboard'); return false;">View Profile ▼</a>
            </div>
        </div>
    </div>
    
    <div class="top-icons">
        <a href="#" class="icon-btn" onclick="navigateTo('landing'); return false;">
            <img src="resources/images/home_icon.png" alt="Home"> 
        </a>
        <a href="#" class="icon-btn" onclick="navigateTo('room'); return false;">
            <img src="resources/images/message_icon.png" alt="Room"> 
        </a>
    </div>
</header>

<script src="app.js"></script>

<script>
    const API_BASE = window.location.origin;

    function displayUsername() {
        const username = window.getCurrentUser ? window.getCurrentUser() : 'Guest'; 
        document.querySelectorAll('.username').forEach(el => {
            el.textContent = username;
        });
        const profileHeader = document.querySelector('.profile-details h2');
        if(profileHeader) {
            profileHeader.textContent = username;
        }
    }
</script>

</body>
</html>
