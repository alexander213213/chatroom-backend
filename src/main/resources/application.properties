spring.application.name=chatroom
server.port=8081

spring.datasource.url=${DB_URL:jdbc:mariadb://127.0.0.1:3306/chatappdb}
spring.datasource.username=${DB_USERNAME:chatapp}
# Secrets come from the environment, never from git
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

chatroom.storage.root=${CHATROOM_STORAGE_ROOT:/var/lib/chatroom}
chatroom.cookie.secure=${COOKIE_SECURE:false}

# Spring defaults to 1MB, which blocked the 200MB attachments the API promises
spring.servlet.multipart.max-file-size=200MB
spring.servlet.multipart.max-request-size=200MB

# base64-encoded, at least 32 bytes: openssl rand -base64 32
jwt.secret=${JWT_SECRET}

spring.datasource.hikari.keepaliveTime=300000
spring.datasource.hikari.connectionTimeout=30000
spring.datasource.hikari.idleTimeout=600000
spring.datasource.hikari.maxLifetime=1800000
